    approved: [claude-haiku-4-5-20251001, claude-sonnet-5, claude-opus-4-8]
    candidates: []
    ledger_validity_writer: false

escalation:
  triggers:
    - dual-pass disagreement
    - citation-gate failure on first-pass output
    - finding severity >= high proposed by a sub-floor tier
    - judge flip detected by the consistency monitors
