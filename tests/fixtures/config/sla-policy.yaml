# Example SLA policy fixture for tests — generic OSS shape matching the
# shipped schema (schema/sla-policy.schema.json).

policy_name: example-sla-policy
source:
  name: Example Vulnerability Management Policy
  retrieved: "2026-07-18"

severity_mapping:
  critical: critical
  important: high
  moderate: medium
  low: low

clock_start: first_routed_or_filed

profiles:
  internal-cve:
    default: true
    description: Default internal CVE SLAs
    slas:
      critical: {resolve_days: 30}
      high:     {resolve_days: 60}
      medium:   {resolve_days: 90}
      low:      {resolve_days: null}
  example-profile:
    description: >-
      Example compliance profile: 30 calendar days for CVEs with CVSS >= 4.0
      regardless of severity rating (cvss_floor_days); medium 90d otherwise.
    cvss_floor_days: {threshold: 4.0, resolve_days: 30}
    slas:
      medium: {resolve_days: 90}
