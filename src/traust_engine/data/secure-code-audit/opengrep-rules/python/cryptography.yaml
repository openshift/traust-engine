rules:
  - id: traust-python-cryptography-requests-verify-false
    languages: [python]
    severity: ERROR
    message: >-
      TLS certificate verification disabled on an outbound request — an
      on-path attacker can read or rewrite the exchange. Pin the expected
      CA bundle instead. CWE-295.
    metadata:
      cwe: ["CWE-295"]
      category: cryptography
      asvs: ["V12"]
      confidence: HIGH
      references:
        - "CWE-295 certificate validation — TLS verify disabled"
    patterns:
      - pattern-either:
          - pattern: requests.$F(..., verify=False, ...)
          - pattern: $SESSION.verify = False
          - pattern: httpx.$F(..., verify=False, ...)

  - id: traust-python-cryptography-ssl-wrap-socket
    languages: [python]
    severity: ERROR
    message: >-
      ssl.wrap_socket() performs no certificate-chain validation and no
      hostname checking (CERT_NONE default) — 'TLS' without
      authentication — and was removed in Python 3.12. Use
      ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT).wrap_socket(sock,
      server_hostname=host) so default verification applies. CWE-295.
    metadata:
      cwe: ["CWE-295"]
      category: cryptography
      asvs: ["V12"]
      confidence: HIGH
      references:
        - "CWE-295 — deprecated ssl.wrap_socket without certificate validation"
    patterns:
      - pattern-either:
          - pattern: ssl.wrap_socket
          - pattern: ssl.wrap_socket(...)

  - id: traust-python-cryptography-insecure-dsn-transport
    languages: [python]
    severity: ERROR
    message: >-
      A database connection string is built with TLS disabled or
      unverified (sslmode=disable/allow/prefer, mysql ssl-mode=DISABLED
      or tls=false) — queries and credentials cross the network in
      plaintext or without server authentication. Default to verify-full
      and make any insecure mode an explicit, documented opt-out.
      CWE-319.
    metadata:
      cwe: ["CWE-319"]
      category: cryptography
      asvs: ["V12"]
      confidence: HIGH
      references:
        - "CWE-319 — database DSN with TLS disabled or unverified"
    patterns:
      - pattern-regex: (?i)sslmode=(disable|allow|prefer)|[?&]tls=(false|skip-verify)|ssl-mode=disabled
